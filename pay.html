<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure personal payment portal for Dylan Alcoy - Seamless Monzo, Revolut, and Bank Transfer payments">
    <title>Payment Portal | Dylan Alcoy</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    
    <!-- Custom Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        portal: {
                            bg: '#0D1117',
                            accent: '#00D1FF',
                            surface: 'rgba(255, 255, 255, 0.03)',
                            border: 'rgba(255, 255, 255, 0.1)',
                            glow: 'rgba(0, 209, 255, 0.4)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-1000px 0' },
                            '100%': { backgroundPosition: '1000px 0' }
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="pay.css">
</head>
<body class="bg-[#0D1117] text-white min-h-screen font-sans antialiased selection:bg-[#00D1FF] selection:text-black">

    <!-- Navigation -->
    <portal-navbar></portal-navbar>

    <main class="container mx-auto px-4 py-8 md:py-16 max-w-5xl relative z-10">
        
        <!-- Hero Section -->
        <section class="text-center mb-12 md:mb-16 space-y-4 animate-fade-in">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 mb-4">
                <i data-feather="shield" class="w-4 h-4 text-[#00D1FF]"></i>
                <span class="text-sm text-gray-300 font-medium">256-bit Encrypted Portal</span>
            </div>
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold tracking-tight">
                <span class="bg-gradient-to-r from-white via-white to-[#00D1FF] bg-clip-text text-transparent">
                    Seamless Payments
                </span>
            </h1>
            <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto font-light">
                Instant, secure transactions optimized for modern banking. 
                Choose your preferred method below.
            </p>
        </section>

        <!-- Primary Payment Method -->
        <section class="mb-8">
            <quick-pay-card></quick-pay-card>
        </section>

        <!-- Alternative Methods -->
        <section class="mb-12">
            <alternative-payments></alternative-payments>
        </section>

        <!-- Bank Details -->
        <section class="mb-16">
            <bank-details-card></bank-details-card>
        </section>

    </main>

    <portal-footer></portal-footer>
    
    <!-- Loading Overlay -->
    <loading-overlay></loading-overlay>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-8 right-8 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Web Components -->
    <script src="components/navbar.js"></script>
    <script src="components/quick-pay-card.js"></script>
    <script src="components/alternative-payments.js"></script>
    <script src="components/bank-details-card.js"></script>
    <script src="components/loading-overlay.js"></script>
    <script src="components/footer.js"></script>
    
    <!-- Main Script -->
    <script src="pay.js"></script>
    <script>feather.replace();</script>
<script src="https://huggingface.co/deepsite/deepsite-badge.js"></script>
</body>
</html>
