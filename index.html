<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Alcoy</title>
    <link rel="icon" type="image/x-icon" href="https://archive.org/download/dylan-alcoy-removebg-preview/Dylan_Alcoy-removebg-preview.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="particles-background"></div>
    
    <!-- Floating Navigation -->
    <nav class="floating-nav">
        <div class="nav-logo">@dylanalcoy</div>
        <ul class="nav-links">
            <li><a href="#home" class="nav-link active" data-i18n="nav.home">Home</a></li>
            <li><a href="#gallery" class="nav-link" data-i18n="nav.gallery">Gallery</a></li>
            <li><a href="#drone" class="nav-link" data-i18n="nav.drone">Drone</a></li>
            <li><a href="#contact" class="nav-link" data-i18n="nav.contact">Contact</a></li>
        </ul>
        <div class="nav-social">
            <a href="https://www.instagram.com/dylanalcoy/" target="_blank" rel="noopener noreferrer" aria-label="Dylan Alcoy Instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <button id="lang-toggle" class="lang-toggle" title="Toggle language">EN / FR</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title" data-speed="0.8">DYLAN ALCOY</h1>
            <p class="hero-subtitle" data-speed="0.6" data-i18n="hero.subtitle">PHOTOGRAPHER • FILMMAKER • DRONE PILOT</p>
            <div class="scroll-indicator" data-speed="0.4">
                <span></span>
            </div>
        </div>
        <div class="hero-image" data-speed="0.2">
            <img src="https://lh3.googleusercontent.com/d/1xs6WkfTewC6wZVxvOPjzFCj5HpGJW_R9" alt="Dylan Alcoy">
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="gallery-section">
        <div class="section-header">
            <h2 data-i18n="gallery.title">Featured Work</h2>
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all" data-i18n="gallery.all">All</button>
                <button class="filter-btn" data-filter="photo" data-i18n="gallery.photo">Photography</button>
                <button class="filter-btn" data-filter="video" data-i18n="gallery.video">Videography</button>
            </div>
        </div>
        
        <div class="gallery-grid">
            <!-- Items will be added dynamically via JS -->
        </div>
        <div class="gallery-controls">
            <button id="view-more-btn" class="view-more-btn" aria-expanded="false">View More</button>
        </div>
    </section>

    <!-- Drone Showcase -->
    <section id="drone" class="drone-section">
        <div class="drone-video">
            <video autoplay loop muted playsinline>
                <source src="https://ia801502.us.archive.org/24/items/0333_20250505/0333.mp4" type="video/mp4">
            </video>
            <div class="drone-overlay">
                <h2 data-speed="0.7" data-i18n="drone.title">AERIAL PERSPECTIVES</h2>
                <p data-speed="0.5" data-i18n="drone.subtitle">Elevating visual storytelling through drone cinematography</p>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <h2 data-i18n="contact.heading">Questions?</h2>
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <input type="text" name="name" id="contact-name" placeholder="Name" data-i18n-placeholder="contact.name" required>
                <span class="focus-border"></span>
            </div>
            <div class="form-group">
                <input type="email" name="email" id="contact-email" placeholder="Email" data-i18n-placeholder="contact.email" required>
                <span class="focus-border"></span>
            </div>
            <div class="form-group">
                <textarea name="message" id="contact-message" placeholder="Your Project Details" data-i18n-placeholder="contact.message" required></textarea>
                <span class="focus-border"></span>
            </div>
            <button type="submit" class="submit-btn" id="contact-submit">
                <span data-i18n="contact.submit">Send Message</span>
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </section>

    <!-- Lightbox Modal -->
    <div class="lightbox">
        <div class="lightbox-content">
            <span class="close-btn">&times;</span>
            <img src="" alt="" class="lightbox-img">
            <div class="lightbox-caption"></div>
        </div>
    </div>

    <!-- Video Hover Player -->
    <div class="video-hover-player">
        <video muted loop class="hover-video"></video>
    </div>

    <script src="script.js"></script>
</body>
</html>
