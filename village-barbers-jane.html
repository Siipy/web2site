<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Delivery API - Sunninghill Village Barbers</title>
    <link rel="icon" type="image/x-icon" href="da.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Masonry Layout using CSS Columns */
        .masonry-grid {
            columns: 1;
            column-gap: 1.5rem;
        }
        
        @media (min-width: 640px) {
            .masonry-grid {
                columns: 2;
            }
        }
        
        @media (min-width: 1024px) {
            .masonry-grid {
                columns: 3;
            }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
        }

        /* Smooth image loading animation */
        .gallery-img {
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.5s ease;
        }
        
        .gallery-img.loaded {
            opacity: 1;
        }

        /* Lightbox transitions */
        .lightbox {
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .lightbox.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .lightbox:not(.hidden) {
            opacity: 1;
            pointer-events: auto;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }

        /* Loading skeleton animation */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        .loading-shimmer {
            background: linear-gradient(90deg, #171717 25%, #262626 50%, #171717 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 antialiased min-h-screen selection:bg-neutral-700 selection:text-white">

    <!-- Header -->
    <header class="py-16 px-4 sm:px-6 lg:px-8 text-center border-b border-neutral-900">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-5xl sm:text-6xl font-light tracking-tighter mb-4 bg-gradient-to-r from-neutral-100 to-neutral-400 bg-clip-text text-transparent">
                Sunninghill Village Barbers
            </h1>
            <p class="text-neutral-500 text-sm sm:text-base tracking-[0.3em] uppercase font-medium">
                Photo Gallery 1 - Edited
            </p>
        </div>
    </header>

    <!-- Gallery Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
        <div id="gallery" class="masonry-grid">
            <!-- Images generated by JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 px-4 border-t border-neutral-900 text-center text-neutral-600 text-sm">
        <p>&copy; 2026 Dylan Alcoy & Sunninghill Village Barbers. All rights reserved.</p>
    </footer>

    <!-- Lightbox Overlay -->
    <div id="lightbox" class="lightbox hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center">
        
        <!-- Close Button -->
        <button id="closeBtn" class="absolute top-4 right-4 z-50 p-3 text-neutral-400 hover:text-white transition-colors duration-200 rounded-full hover:bg-white/10">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>

        <!-- Navigation Buttons -->
        <button id="prevBtn" class="absolute left-2 sm:left-4 z-50 p-2 sm:p-3 text-neutral-400 hover:text-white transition-all duration-200 rounded-full hover:bg-white/10 hidden sm:block group">
            <i data-lucide="chevron-left" class="w-8 h-8 sm:w-12 sm:h-12 group-hover:scale-110 transition-transform"></i>
        </button>
        
        <button id="nextBtn" class="absolute right-2 sm:right-4 z-50 p-2 sm:p-3 text-neutral-400 hover:text-white transition-all duration-200 rounded-full hover:bg-white/10 hidden sm:block group">
            <i data-lucide="chevron-right" class="w-8 h-8 sm:w-12 sm:h-12 group-hover:scale-110 transition-transform"></i>
        </button>

        <!-- Image Container -->
        <div class="relative w-full h-full flex items-center justify-center p-4 sm:p-12 md:p-16" id="lightboxContainer">
            <img id="lightboxImage" src="" alt="" class="max-w-full max-h-full object-contain shadow-2xl select-none">
            
            <!-- Loading Indicator -->
            <div id="lightboxLoader" class="absolute inset-0 flex items-center justify-center hidden">
                <div class="w-12 h-12 border-2 border-neutral-700 border-t-white rounded-full animate-spin"></div>
            </div>
        </div>

        <!-- Mobile Navigation Areas (invisible touch targets) -->
        <div id="mobilePrev" class="absolute left-0 top-0 w-1/3 h-full z-40 sm:hidden cursor-pointer"></div>
        <div id="mobileNext" class="absolute right-0 top-0 w-1/3 h-full z-40 sm:hidden cursor-pointer"></div>

        <!-- Counter -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-4">
            <span class="text-neutral-400 text-sm font-medium tracking-widest">
                <span id="currentIndex">1</span> / <span id="totalCount">27</span>
            </span>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Configuration
        const CONFIG = {
            totalImages: 27,
            baseUrl: 'https://villagebarbers.s3.eu-north-1.amazonaws.com/Initial-Photo-Gallery-WM5mb/VillageB-WM-',
            imageExtension: '.JPG'
        };

        // Generate image data
        const images = Array.from({ length: CONFIG.totalImages }, (_, i) => ({
            id: i + 1,
            src: `${CONFIG.baseUrl}${i + 1}${CONFIG.imageExtension}`,
            alt: `Village Barbers Photography ${i + 1}`,
            loaded: false
        }));

        // State Management
        let currentIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;
        let isLightboxOpen = false;

        // DOM Elements
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxLoader = document.getElementById('lightboxLoader');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const mobilePrev = document.getElementById('mobilePrev');
        const mobileNext = document.getElementById('mobileNext');
        const currentIndexEl = document.getElementById('currentIndex');
        const totalCountEl = document.getElementById('totalCount');

        // Initialize
        totalCountEl.textContent = CONFIG.totalImages;

        // Create Gallery Items
        function initGallery() {
            const fragment = document.createDocumentFragment();

            images.forEach((image, index) => {
                const item = document.createElement('div');
                item.className = 'masonry-item group relative cursor-pointer overflow-hidden rounded-sm bg-neutral-900';
                
                // Create aspect ratio placeholder to prevent layout shift
                const aspectRatio = document.createElement('div');
                aspectRatio.className = 'loading-shimmer absolute inset-0';
                
                const img = document.createElement('img');
                img.src = image.src;
                img.alt = image.alt;
                img.loading = 'lazy';
                img.className = 'gallery-img w-full h-auto block relative z-10';
                
                // Handle load event
                img.addEventListener('load', () => {
                    img.classList.add('loaded');
                    image.loaded = true;
                });

                // Error handling
                img.addEventListener('error', () => {
                    console.warn(`Failed to load image: ${image.src}`);
                    item.style.display = 'none';
                });

                // Open lightbox on click
                item.addEventListener('click', () => openLightbox(index));
                
                item.appendChild(aspectRatio);
                item.appendChild(img);
                fragment.appendChild(item);
            });

            gallery.appendChild(fragment);
        }

        // Lightbox Functions
        function openLightbox(index) {
            currentIndex = index;
            isLightboxOpen = true;
            updateLightbox();
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            // Preload adjacent images
            preloadAdjacent();
        }

        function closeLightbox() {
            isLightboxOpen = false;
            lightbox.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const image = images[currentIndex];
            lightboxLoader.classList.remove('hidden');
            lightboxImage.style.opacity = '0.3';
            
            // Create new image object to handle loading
            const img = new Image();
            img.onload = () => {
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt;
                lightboxLoader.classList.add('hidden');
                lightboxImage.style.opacity = '1';
            };
            img.src = image.src;
            
            currentIndexEl.textContent = currentIndex + 1;
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % CONFIG.totalImages;
            updateLightbox();
            preloadAdjacent();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + CONFIG.totalImages) % CONFIG.totalImages;
            updateLightbox();
            preloadAdjacent();
        }

        function preloadAdjacent() {
            // Preload next and previous images
            const next = (currentIndex + 1) % CONFIG.totalImages;
            const prev = (currentIndex - 1 + CONFIG.totalImages) % CONFIG.totalImages;
            
            [next, prev].forEach(i => {
                const img = new Image();
                img.src = images[i].src;
            });
        }

        // Event Listeners
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLightbox();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            nextImage();
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            prevImage();
        });

        // Mobile touch targets
        mobileNext.addEventListener('click', (e) => {
            e.stopPropagation();
            nextImage();
        });

        mobilePrev.addEventListener('click', (e) => {
            e.stopPropagation();
            prevImage();
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!isLightboxOpen) return;
            
            switch(e.key) {
                case 'Escape':
                    closeLightbox();
                    break;
                case 'ArrowRight':
                    nextImage();
                    break;
                case 'ArrowLeft':
                    prevImage();
                    break;
            }
        });

        // Swipe Detection for Mobile
        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    nextImage(); // Swipe left -> next
                } else {
                    prevImage(); // Swipe right -> prev
                }
            }
        }

        // Close on background click (but not on image)
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.id === 'lightboxContainer') {
                closeLightbox();
            }
        });

        // Initialize Gallery
        initGallery();
    </script>
</body>
</html>
